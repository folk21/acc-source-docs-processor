[locale]
code = en
name = English

[app]
page_title = Accounting Document Processing
language_label = Interface language
title = Local Accounting Document Processor
description =
    This application runs accounting-document operations directly on this computer. Files are not uploaded to external services, source documents are not modified, and results are written to a separately selected output folder.

    Review generated files before using them. OCR and automatic recognition can be inaccurate on low-quality scans, handwriting, stamps, and unusual document layouts.
operation_label = Operation
operation_help = Select the action to run for a document folder.
no_supported_operations = The selected language configuration does not contain a supported operation.
unsupported_operations = The configuration contains unknown operations: {operations}

[operations]
ids =
    anonymize
    process_npd_receipts
    process_incoming_purchase_documents
    process_upd_invoices_status_1

[operation.anonymize]
title = Document anonymization
description =
    Creates local document copies in which detected personal and confidential data is masked or replaced according to an INI configuration. PDF, DOCX, XLSX, TXT, and common raster-image formats are supported. Relative subfolder structure is preserved.

    The operation runs locally and does not modify source files. Review the output before sharing it with third parties.

[operation.process_npd_receipts]
title = Process NPD receipts
description =
    Recognizes scanned professional-income-tax receipts, copies every image into the output folder, renames recognized receipts, and creates the linked npd_receipts_registry.xlsx workbook.

    Only recognized receipts are included in the workbook. Unrecognized images are still copied without renaming for manual review.
source_path = ../acc-work/input/npd_receipts
output_path = ../acc-work/output/npd_receipts

[operation.process_incoming_purchase_documents]
title = Register incoming electronic UPD documents
description =
    Processes incoming UPD status 1 documents in PDF and DOCX for later entry into 1C. It extracts document identity, parties, totals, and item rows, validates arithmetic, and creates a working workbook with Documents, Items, and Review sheets.

    Source PDF and DOCX files are not copied; the workbook links to them. Incompletely recognized documents remain visible for manual review.
source_path = ../acc-work/input/incoming_purchase_documents
output_path = ../acc-work/output/incoming_purchase_documents

[operation.process_upd_invoices_status_1]
title = Process scanned UPD status 1 documents
description =
    Finds Russian UPD status 1 documents in scanned images, corrects orientation, extracts document number and date, copies and renames recognized pages, attaches continuations, and creates a CSV registry plus a text report.

    Unrecognized images are also copied for manual review. Source files are not modified.
source_path = ../acc-work/input/upd_invoices_status_1
output_path = ../acc-work/output/upd_invoices_status_1

[defaults]
source_path = ../acc-work/input/anonymization
output_path = ../acc-work/output/anonymization
anonymization_config_path = ../acc-work/config/anonymization.ini
ocr_language = rus+eng


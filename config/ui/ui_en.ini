[locale]
code = en
name = English

[app]
page_title = Accounting Document Processing
language_label = Interface language
title = Local Accounting Document Processor
description =
    This application runs accounting-document operations directly on this computer. Files are not uploaded to external services, source documents are not modified, and results are written to a separately selected output folder.

    Review generated files before using them. OCR and automatic recognition can be inaccurate on low-quality scans, handwriting, stamps, and unusual document layouts.
operation_label = Operation
operation_help = Select the action to run for a document folder.
no_supported_operations = The selected language configuration does not contain a supported operation.
unsupported_operations = The configuration contains unknown operations: {operations}

[operations]
ids = anonymize

[operation.anonymize]
title = Document anonymization
description =
    Creates local document copies in which detected personal and confidential data is masked or replaced according to an INI configuration. PDF, DOCX, TXT, and common raster-image formats are supported. Relative subfolder structure is preserved.

    The operation runs locally and does not modify source files. Review the output before sharing it with third parties.

[defaults]
source_path = ../acc-work/input/anonymization
output_path = ../acc-work/output/anonymization
anonymization_config_path = ../acc-work/config/anonymization.ini
ocr_language = rus+eng

[anonymize]
source_label = Source folder
source_help = Folder with source documents. Subfolders are processed recursively.
output_label = Output folder
output_help = Folder for anonymized copies. Source files are not modified.
config_label = Anonymization rules file
config_help = INI file with included, includedAndReplaced, excluded, and includedParagraphs rules.
ocr_language_label = OCR languages
ocr_language_help = Tesseract languages, for example rus+eng.
output_mode_label = Output format
output_mode_help = Preserve source formats, create editable DOCX files, or generate both variants.
output_mode_source = Preserve source formats
output_mode_docx = Create editable DOCX files
output_mode_docx_and_source = Create DOCX and source-format copies
preserve_layout_label = Approximate the source layout in DOCX
preserve_layout_help = Applies only to DOCX output. Reconstructs page dimensions, line positions, and approximate font sizes without embedding the source scan as a background.
clear_output_label = Clear the output folder before processing
clear_output_help = Removes existing files and links while preserving the output folder and existing subdirectories.
run_button = Start anonymization
running_status = Anonymization is running…
completed_status = Anonymization completed
completed_with_errors = Anonymization completed with errors
failed_status = Anonymization failed
unexpected_error = Processing error: {error}
progress_file_started = File {file_index} of {file_count}: {file_name}
progress_unit_started = File {file_index} of {file_count}, {unit_name} {unit_index} of {unit_count}: {file_name}

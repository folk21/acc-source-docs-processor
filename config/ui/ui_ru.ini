[locale]
code = ru
name = Русский

[app]
page_title = Обработка бухгалтерских документов
language_label = Язык интерфейса
title = Локальный обработчик бухгалтерских документов
description =
    Приложение запускает операции над бухгалтерскими документами непосредственно на этом компьютере. Файлы не отправляются во внешние сервисы, исходные документы не изменяются, а результаты записываются в отдельно указанную папку.

    Перед использованием результата проверьте созданные файлы вручную: OCR и автоматическое распознавание могут ошибаться на некачественных сканах, рукописных полях, печатях и нестандартных макетах.
operation_label = Операция
operation_help = Выберите действие, которое требуется выполнить над папкой документов.
no_supported_operations = В выбранной языковой конфигурации нет поддерживаемых операций.
unsupported_operations = В конфигурации указаны неизвестные операции: {operations}

[operations]
ids = anonymize

[operation.anonymize]
title = Анонимизация документов
description =
    Создаёт локальные копии документов, в которых найденные персональные и конфиденциальные данные маскируются или заменяются согласно INI-конфигурации. Поддерживаются PDF, DOCX, TXT и распространённые форматы изображений. Относительная структура подпапок сохраняется.

    Операция работает локально и не изменяет исходные файлы. Результат необходимо проверить перед передачей третьим лицам.

[defaults]
source_path = ../acc-work/input/anonymization
output_path = ../acc-work/output/anonymization
anonymization_config_path = ../acc-work/config/anonymization.ini
ocr_language = rus+eng

[anonymize]
source_label = Входная папка
source_help = Папка с исходными документами. Подпапки обрабатываются рекурсивно.
output_label = Выходная папка
output_help = Папка для анонимизированных копий. Исходные файлы не изменяются.
config_label = Файл правил анонимизации
config_help = INI-файл с included, includedAndReplaced, excluded и includedParagraphs.
ocr_language_label = Языки OCR
ocr_language_help = Языки Tesseract, например rus+eng.
output_mode_label = Формат результата
output_mode_help = Можно сохранить исходные форматы, создать редактируемые DOCX или получить оба варианта.
output_mode_source = Сохранить исходные форматы
output_mode_docx = Создать редактируемые DOCX
output_mode_docx_and_source = Создать DOCX и копии в исходных форматах
preserve_layout_label = Приблизительно сохранить макет в DOCX
preserve_layout_help = Применяется только к DOCX. Восстанавливает размеры страниц, расположение строк и примерные размеры шрифта без вставки исходного скана как фона.
clear_output_label = Очистить выходную папку перед запуском
clear_output_help = Удаляет находящиеся в ней файлы и ссылки, но сохраняет саму папку и существующие подпапки.
run_button = Запустить анонимизацию
running_status = Выполняется анонимизация…
completed_status = Анонимизация завершена
completed_with_errors = Анонимизация завершена с ошибками
failed_status = Анонимизация не выполнена
unexpected_error = Ошибка выполнения: {error}
progress_file_started = Файл {file_index} из {file_count}: {file_name}
progress_unit_started = Файл {file_index} из {file_count}, {unit_name} {unit_index} из {unit_count}: {file_name}
progress_file_finished = Обработан файл {file_index} из {file_count}: {file_name}
progress_file_failed = Ошибка в файле {file_index} из {file_count}: {file_name}. {error}
results_title = Результаты последнего запуска
metric_succeeded = Успешно
metric_failed = Ошибки
metric_generated = Создано файлов
metric_detected = Найдено фрагментов
column_source = Исходный файл
column_status = Статус
column_outputs = Созданные файлы
column_detected = Найдено фрагментов
column_error = Ошибка
status_success = Успешно
status_failed = Ошибка

[validation]
source_missing = Входная папка не существует: {path}
source_not_directory = Входной путь не является папкой: {path}
output_not_directory = Выходной путь существует, но не является папкой: {path}
source_equals_output = Входная и выходная папки должны различаться: {path}
unsafe_clear_output = Нельзя очищать выходную папку, если входная папка находится внутри неё: {path}
config_missing = Файл правил анонимизации не существует: {path}
config_not_file = Путь к правилам анонимизации не является файлом: {path}

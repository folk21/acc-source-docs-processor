[locale]
code = ru
name = Русский

[app]
page_title = Обработка бухгалтерских документов
language_label = Язык интерфейса
title = Локальный обработчик бухгалтерских документов
description =
    Приложение запускает операции над бухгалтерскими документами непосредственно на этом компьютере. Файлы не отправляются во внешние сервисы, исходные документы не изменяются, а результаты записываются в отдельно указанную папку.

    Перед использованием результата проверьте созданные файлы вручную: OCR и автоматическое распознавание могут ошибаться на некачественных сканах, рукописных полях, печатях и нестандартных макетах.
operation_label = Операция
operation_help = Выберите действие, которое требуется выполнить над папкой документов.
no_supported_operations = В выбранной языковой конфигурации нет поддерживаемых операций.
unsupported_operations = В конфигурации указаны неизвестные операции: {operations}

[operations]
ids =
    anonymize
    process_npd_receipts
    process_incoming_purchase_documents
    process_upd_invoices_status_1

[operation.anonymize]
title = Анонимизация документов
description =
    Создаёт локальные копии документов, в которых найденные персональные и конфиденциальные данные маскируются или заменяются согласно INI-конфигурации. Поддерживаются PDF, DOCX, TXT и распространённые форматы изображений. Относительная структура подпапок сохраняется.

    Операция работает локально и не изменяет исходные файлы. Результат необходимо проверить перед передачей третьим лицам.

[operation.process_npd_receipts]
title = Обработка чеков НПД
description =
    Распознаёт сканированные чеки налога на профессиональный доход, копирует все изображения в выходную папку, переименовывает распознанные чеки и формирует связанный Excel-реестр npd_receipts_registry.xlsx.

    В реестр попадают только распознанные чеки. Нераспознанные изображения всё равно копируются без переименования для последующей ручной проверки.
source_path = ../acc-work/input/npd_receipts
output_path = ../acc-work/output/npd_receipts

[operation.process_incoming_purchase_documents]
title = Реестр входящих электронных УПД
description =
    Обрабатывает входящие УПД статуса 1 в PDF и DOCX для последующего внесения в 1С. Извлекает реквизиты документа, стороны, суммы и товарные строки, проверяет арифметику и формирует рабочую книгу с листами Documents, Items и Review.

    Исходные PDF и DOCX не копируются: в книге создаются ссылки на них. Документы с неполным распознаванием остаются видимыми для ручной проверки.
source_path = ../acc-work/input/incoming_purchase_documents
output_path = ../acc-work/output/incoming_purchase_documents

[operation.process_upd_invoices_status_1]
title = Обработка сканов УПД статуса 1
description =
    Находит на изображениях российские УПД со статусом 1, корректирует ориентацию, извлекает номер и дату, копирует и переименовывает распознанные страницы, присоединяет продолжения и формирует CSV-реестр с текстовым отчётом.

    Нераспознанные изображения также копируются для ручной проверки. Исходные файлы не изменяются.
source_path = ../acc-work/input/upd_invoices_status_1
output_path = ../acc-work/output/upd_invoices_status_1

[defaults]
source_path = ../acc-work/input/anonymization
output_path = ../acc-work/output/anonymization
anonymization_config_path = ../acc-work/config/anonymization.ini
ocr_language = rus+eng


[anonymization]
# Used only when both included and includedAndReplaced are empty.
# Literal fragments remain visible inside default Presidio detections.
excluded =

# When included or includedAndReplaced is non-empty, only explicit configured
# rules are applied; default Presidio detections and excluded are ignored.
# Values listed here are masked. A matching includedAndReplaced rule takes priority.
included =

# Replace configured literals instead of masking them.
# Syntax: source -> replacement
includedAndReplaced =
    компанияX -> компанияY
    Петров -> Иванов
    Петр -> Иван
    Петрович -> Иванович
    долина -> планета

# OCR-only tolerant matching for included and includedAndReplaced source values.
# Native TXT and DOCX text remain exact.
includedFuzzy = true

# Maximum total insertions, deletions, or substitutions per configured value.
# Supported range: 0-3. A value of 1 is the safest default.
includedFuzzyMaxErrors = 1

# Headings after which the remaining page area and all following PDF/TIFF pages are redacted.
includedParagraphs = 9. Реквизиты и подписи сторон

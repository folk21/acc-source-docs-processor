[anonymization]
# Entity detection source:
# automatic  - targeted Presidio/spaCy PII and project recognizers only.
# configured - included and includedAndReplaced only.
# combined   - automatic detections plus configured rules; configured rules win.
# disabled   - no entity detection; includedParagraphs remains independent.
entityDetectionMode = combined

# Automatic detection is intentionally targeted. It keeps amounts, dates, and
# ordinary receipt text visible while masking names, organizations/locations,
# identifiers, bank/card data, email/IP values, and explicit phone patterns.
# Single-word NER guesses are ignored to reduce false positives in receipt text.

# Exclusions apply only to automatic detections in automatic and combined modes.
# Explicit included and includedAndReplaced rules are never canceled by excluded.
excluded =

# Values listed here are masked in configured and combined modes.
included =

# Replace configured literals instead of masking them in configured and combined modes.
# Syntax: source -> replacement
includedAndReplaced =
    компанияX -> компанияY
    Петров -> Иванов
    Петр -> Иван
    Петрович -> Иванович
    долина -> планета

# OCR-only tolerant matching for included and includedAndReplaced source values.
# Native TXT and DOCX text remain exact.
includedFuzzy = true

# Maximum total insertions, deletions, or substitutions per configured value.
# Supported range: 0-3. A value of 1 is the safest default.
includedFuzzyMaxErrors = 1

# Headings after which the remaining page area and all following PDF/TIFF pages are redacted.
# This rule is independent from entityDetectionMode.
includedParagraphs = 9. Реквизиты и подписи сторон
